services:
  - type: web
    name: mangahub-api
    runtime: go
    plan: starter
    buildCommand: go build -o api-server ./cmd/api-server
    startCommand: ./api-server
    healthCheckPath: /health
    envVars:
      - key: MANGAHUB_HTTP_HOST
        value: 0.0.0.0
      - key: MANGAHUB_DATABASE_PATH
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: MANGAHUB_CORS_ORIGINS
        value: https://mangathienphu-src.vercel.app,https://manga-thien-phu.vercel.app,http://localhost:3000
      - key: MANGAHUB_JWT_SECRET
        generateValue: true
